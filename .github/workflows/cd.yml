name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "bot=ghcr.io/${repo}:bot-${sha}" >> "$GITHUB_OUTPUT"
          echo "bot_latest=ghcr.io/${repo}:bot-latest" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${repo}:worker-${sha}" >> "$GITHUB_OUTPUT"
          echo "worker_latest=ghcr.io/${repo}:worker-latest" >> "$GITHUB_OUTPUT"

      - name: Push bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bot.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.bot }}
            ${{ steps.meta.outputs.bot_latest }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=min,scope=bot

      - name: Push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.worker }}
            ${{ steps.meta.outputs.worker_latest }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=min,scope=worker

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    if: vars.ENABLE_VPS_DEPLOY == 'true'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose exec -T bot alembic upgrade head
