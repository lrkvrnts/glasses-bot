services:
  caddy:
    image: caddy:2-alpine
    profiles: ["webhook"]  # только если переключишься на webhook
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      WEBHOOK_URL_HOST: ${WEBHOOK_URL_HOST:-localhost}
    depends_on:
      bot: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    env_file: .env
    expose: ["8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    command: celery -A bot.tasks.celery_app worker -l INFO --concurrency=4
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    deploy: { replicas: 2 }

  beat:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    env_file: .env
    command: celery -A bot.tasks.celery_app beat -l INFO
    depends_on: [postgres, redis]
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    ports: ["5555:5555"]
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on: [redis, worker]
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}
